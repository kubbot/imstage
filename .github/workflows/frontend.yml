name: Frontend

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMSTAGE_BROWSER: chromium
      IMSTAGE_ARTIFACT_DIR: .local/ci-artifacts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: .local/ci-artifacts
          include-hidden-files: true
          retention-days: 7
