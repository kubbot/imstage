# Production services; use a reviewed immutable IMAGE_TAG for each release.
# Host networking preserves the applications' enforced loopback-only binding.
name: imstage
x-service: &service
  image: imstage:${IMAGE_TAG:?Set IMAGE_TAG to the release commit}
  network_mode: host
  restart: unless-stopped
  init: true
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  tmpfs: ["/tmp:size=268435456,mode=1777"]
  logging:
    driver: json-file
    options: {max-size: 10m, max-file: "3"}
services:
  api:
    <<: *service
    env_file: /etc/imstage/api.env
    environment:
      NODE_ENV: production
      IMSTAGE_API_PORT: "4419"
      IMSTAGE_DATA_DIR: /data
      IMSTAGE_DIST_DIR: /app/dist
    volumes: [/var/lib/imstage/api:/data:Z]
    mem_limit: 2g
    cpus: 1.5
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:4419/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
  mcp:
    <<: *service
    command: [node, services/mcp/server.mjs]
    env_file: /etc/imstage/mcp.env
    environment:
      NODE_ENV: production
      IMSTAGE_MCP_PORT: "4421"
      IMSTAGE_MCP_DATA_DIR: /data
    volumes: [/var/lib/imstage/mcp:/data:Z]
    mem_limit: 1536m
    cpus: 1
