<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>截图数据集 · IMStage</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/dataset.css"></head><body>
<div class="dataset-shell"><aside class="dataset-sidebar"><a class="brand" href="/"><span class="brand-icon">im<span>.</span></span><span>IMStage <small>截图数据集</small></span></a><a class="back-link" href="/">← 场景笔记</a><div class="history-head"><span>你的评测集</span><span id="count">—</span></div><label class="search"><span class="sr-only">搜索用例</span><input id="search" type="search" placeholder="搜索问题、平台…"></label><label class="difficulty-filter">难度 <select id="difficulty"><option value="">全部</option><option value="1">L1 · 单点替换</option><option value="2">L2 · 多处一致</option><option value="3">L3 · 结构与尺寸</option><option value="4">L4 · 复合编辑</option><option value="5">L5 · 完整本地化</option></select></label><nav id="cases" aria-label="评测用例"></nav><div class="dataset-local"><i></i> 私有素材 · 本机标注</div></aside>
<main class="dataset-main"><header class="topbar"><span class="breadcrumb">数据集 <span>/</span> <b>截图编辑</b></span><span id="run-state" role="status"></span><button id="run-agent" class="primary">运行 DeepSeek Agent 全套评测</button><button id="refresh" class="quiet">刷新结果 ↻</button></header><div id="dataset-error" class="dataset-error" role="alert" hidden></div><div id="loading" class="dataset-loading">正在读取用例…</div><div id="content" hidden><section class="dataset-heading"><div><span id="case-meta" class="eyebrow"></span><h1 id="title"></h1></div><span id="suite-status" class="suite-status"></span></section><section class="task-note"><span class="section-label">输入给 AI 的问题</span><p id="task"></p></section>
<div class="comparison"><section class="image-column"><div class="image-heading"><h2>原始截图</h2><span id="source-size"></span></div><a id="source-link" target="_blank" rel="noopener"><img id="source" alt="原始聊天截图"></a></section><section class="image-column"><div class="image-heading"><h2>参考答案</h2><span id="expected-badge">待你确认</span></div><a id="expected-link" target="_blank" rel="noopener"><img id="expected" alt="待确认的参考输出"></a><p id="expected-empty" class="image-empty" hidden>参考图片尚未生成</p><button class="secondary review-open" data-kind="expected">评判参考答案</button></section><section class="image-column"><div class="image-heading"><h2>DeepSeek 输出</h2><span id="actual-badge">未运行</span></div><a id="actual-link" target="_blank" rel="noopener"><img id="actual" alt="DeepSeek 实际生成输出"></a><p id="actual-empty" class="image-empty" hidden>这张图还没有模型输出</p><button class="secondary review-open" data-kind="actual">评判模型输出</button></section></div>
<div class="answer-grid"><section class="answer-card"><span class="section-label">预期是什么</span><p id="answer"></p><p class="proposed-note">参考图由明确的编辑规则渲染，等待你的判断。模型生成时看不到参考答案。</p></section><section class="answer-card"><span class="section-label">图像分析与检查点</span><ul id="analysis"></ul></section></div><details class="score-details"><summary>自动评测细节 <span id="score-summary"></span></summary><div id="checks"></div><details><summary>Agent 实际工具轨迹</summary><div id="tool-trace"></div></details><p>自动分数检查文本、位置、尺寸及未修改区域；视觉自然度与最终金标由你确认。</p></details></div></main></div>
<dialog id="review-dialog"><h2 id="review-title"></h2><p id="review-state"></p><div class="verdict-buttons"><button id="good" class="verdict" aria-pressed="false">✓ 好，符合预期</button><button id="bad" class="verdict" aria-pressed="false">× 不好，需要改进</button></div><label for="note">留一句评价</label><textarea id="note" maxlength="4000" rows="3" placeholder="哪里符合预期，或需要如何调整？"></textarea><p id="review-error" role="alert"></p><div class="dialog-actions"><button id="close" class="quiet">取消</button><button id="save" class="primary">保存标注</button><button id="golden" class="secondary" hidden>确认为金标</button><button id="clear" class="quiet" hidden>撤销标注</button></div></dialog><script type="module" src="/dataset.js"></script></body></html>
