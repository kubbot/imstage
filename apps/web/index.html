<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="IMStage：合成聊天场景与评测数据集标注创作工具。仅供测试与学习，不得用于伪造证据、欺诈、诽谤或冒充；导出图片固定带 AI生成/虚构 标识。Synthetic chat authoring for tests and evaluation datasets." />
    <meta property="og:title" content="IMStage · 合成对话，用于测试与评测" />
    <meta property="og:description" content="生成带 AI生成/虚构 标识的合成聊天样本，用于测试与评测。Synthetic chat samples for tests and evaluation." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta property="og:url" content="https://imstage.org/" />
    <meta property="og:image" content="https://imstage.org/assets/share/website.png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="900" />
    <meta property="og:image:alt" content="Edit a synthetic conversation in IMStage and export the rendered generic chat scene." />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='9' fill='%23fafaf7'/%3E%3Cpath d='M15 8H8v24h7M25 8h7v24h-7M15 15l10 5-10 5' fill='none' stroke='%23b63a22' stroke-width='2.6'/%3E%3C/svg%3E" />
    <title>IMStage · 合成对话，用于测试与评测</title>
    <script>
      // Theme and language bootstraps run before React so the first paint uses
      // the stored preference. Both keys are owned by this site.
      try {
        const preference = localStorage.getItem('imstage-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
      try {
        const search = new URLSearchParams(location.search).get('lang');
        const hashQuery = location.hash.indexOf('?') >= 0 ? new URLSearchParams(location.hash.slice(location.hash.indexOf('?'))).get('lang') : null;
        const explicit = search || hashQuery;
        const stored = localStorage.getItem('imstage-locale');
        const tag = (navigator.languages && navigator.languages[0]) || navigator.language || '';
        const detected = explicit === 'zh' || explicit === 'en' ? explicit
          : stored === 'zh' || stored === 'en' ? stored
          : /^zh\b/i.test(tag) ? 'zh' : 'en';
        document.documentElement.lang = detected === 'zh' ? 'zh-CN' : 'en';
        document.documentElement.dataset.locale = detected;
        localStorage.setItem('imstage-locale', detected);
      } catch { /* Language still resolves in React. */ }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
