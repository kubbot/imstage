    <meta name="theme-color" content="#111214" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="IMStage 官网原型 A · 对话导演台：一句话开场，改一句台词，导出聊天画面。" />
    <title>IMStage 原型 A · 对话导演台</title>
    <script>
      // Prototype-owned theme key; never touches the application preference.
      try {
        const preference = localStorage.getItem('imstage-prototype-theme');
        document.documentElement.dataset.theme = preference === 'light' || preference === 'dark'
          ? preference : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      } catch { document.documentElement.dataset.theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'; }
    </script>

    <div id="root"></div>
